[package]
name = "unscratch"
version = "0.1.0"
edition = "2024"
description = "A CLI tool to help pack and unpack Scratch project files"
repository = "https://github.com/Eeviika/unscratch_rust"
license = "MIT"
keywords = ["cli", "scratch"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.4.0"
file-format = "0.29.0"
indicatif = "0.18.4"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
zip = "8.2.0"
